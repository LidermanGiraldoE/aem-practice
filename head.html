<meta
  http-equiv="Content-Security-Policy"
  content="script-src 'nonce-aem' 'strict-dynamic' 'unsafe-inline' http: https:; base-uri 'self'; object-src 'none';"
  move-to-http-header="true"
>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<!-- Set theme before first paint to avoid a dark/light flash -->
<script nonce="aem">
  (() => {
    let theme = 'dark';
    try {
      const saved = localStorage.getItem('aem-forge-theme');
      if (saved === 'dark' || saved === 'light') theme = saved;
    } catch { /* storage unavailable */ }
    document.documentElement.dataset.theme = theme;
  })();
</script>
<script nonce="aem" type="speculationrules">
  {
    "prerender": [{
        "where": {
            "href_matches": "/*"
        },
        "eagerness": "moderate"
    }]
  }
</script>
<script nonce="aem" type="importmap">
  {
    "imports": {
        "@dropins/tools/": "/scripts/__dropins__/tools/",
        "driver.js": "/scripts/vendor/driver.js/dist/driver.js.mjs",
        "htm": "/scripts/vendor/htm/dist/htm.mjs",
        "swiper": "/scripts/vendor/swiper/swiper.min.mjs",
        "swiper/": "/scripts/vendor/swiper/",
        "tailwind-variants": "/scripts/vendor/tailwind-variants/dist/lite.js"
    }
  }
</script>
<script nonce="aem" src="/scripts/dompurify.min.js"></script>
<script nonce="aem" src="/scripts/aem.js" type="module"></script>
<script nonce="aem" src="/scripts/scripts.js" type="module"></script>
<link rel="stylesheet" href="/styles/styles.css"/>
<link rel="stylesheet" href="/styles/tailwind.css"/>
